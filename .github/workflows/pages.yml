name: Deploy splash to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Single-project repo — no submodules to fetch. The splash reads
          # ../changelog and ../context-v as plain file IO from the parent
          # repo's working tree.
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Newest release, not a pin. splash/pnpm-workspace.yaml's allowBuilds
          # needs pnpm >= 10.26; older versions ignore it.
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Newest LTS. Astro supports even-numbered Node only (>= 22.12), so
          # this is "latest" without risking an odd-numbered Current release.
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: splash/pnpm-lock.yaml

      - name: Install
        # No --ignore-workspace: splash/ is its own pnpm root now, and that flag
        # would make pnpm skip splash/pnpm-workspace.yaml (and its allowBuilds).
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages on first run so the workflow bootstraps itself
          # even when "Get Pages site" returns 404 the very first time.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: splash/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
